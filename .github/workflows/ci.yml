name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual re-deploy without an empty commit. Only users with write access can
  # fire it, so it carries no fork risk — unlike pull_request.
  workflow_dispatch:

# A newer push makes an in-flight run pointless — except on master, where each
# commit's result is worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Both ends of the `engines` range: type stripping runs the .ts files
      # directly, so a version difference shows up at runtime, not at build.
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build-only

      # The CLIs are type-stripped at load; a syntax form Node cannot strip
      # (parameter properties, enums) passes tsc and fails only when run.
      - name: Smoke-check the entry points
        run: |
          node scripts/threads.ts help
          node scripts/agent.ts help
          node scripts/agent.ts slots

  # Deploy runs on the Pi itself, through a self-hosted runner. Gated on `push`
  # to master so a pull request from a fork can never reach the machine — the
  # repo is public, and the deployment is the `pi` user's own home directory.
  deploy:
    needs: check
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, threads-agent]
    # npm ci plus a Vite build on ARM is slow; observer-app and foodie allow the
    # same 40.
    timeout-minutes: 40

    steps:
      # Чекаут у робочу папку runner'а — тільки заради самого скрипта, щоб
      # деплой виконувався тією версією deploy.sh, що прийшла в цьому коміті.
      # Прод-папку скрипт оновлює сам (APP_DIR), своїм git fetch/merge.
      - uses: actions/checkout@v5

      - name: Deploy
        run: ./scripts/deploy.sh
        env:
          APP_DIR: /home/pi/Projects/threads-agent
