name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual re-deploy without an empty commit. Only users with write access can
  # fire it, so it carries no fork risk — unlike pull_request.
  workflow_dispatch:

# A newer push makes an in-flight run pointless — except on master, where each
# commit's result is worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Both ends of the `engines` range: type stripping runs the .ts files
      # directly, so a version difference shows up at runtime, not at build.
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build-only

      # The CLIs are type-stripped at load; a syntax form Node cannot strip
      # (parameter properties, enums) passes tsc and fails only when run.
      - name: Smoke-check the entry points
        run: |
          node scripts/threads.ts help
          node scripts/agent.ts help
          node scripts/agent.ts slots

  # Deploy runs on the Pi itself, through a self-hosted runner. Gated on `push`
  # to master so a pull request from a fork can never reach the machine — the
  # repo is public and the runner's user has passwordless sudo.
  deploy:
    needs: check
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, threads-agent]
    timeout-minutes: 30

    steps:
      # No checkout: install.sh pulls into /opt/threads-agent itself, so the
      # runner's own working copy never becomes a second source of truth.
      #
      # By path, not `sudo bash <path>`: sudoers matches the whole command line,
      # and 020_pi-deploy grants the script — `bash` with it as an argument is a
      # different command, which falls through to the password-prompting rule.
      - name: Pull, rebuild and restart
        run: sudo /opt/threads-agent/deploy/install.sh
