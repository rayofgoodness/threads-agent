# Cloudflare Tunnel: the Pi dials out to Cloudflare, so nothing has to be
# port-forwarded and the origin stays on loopback.
#
#   cloudflared tunnel login
#   cloudflared tunnel create threads-agent
#   cloudflared tunnel route dns --overwrite-dns threads-agent quarters.casa
#   sudo cloudflared service install
#
# `--overwrite-dns` matters: quarters.casa already resolves to a proxied record
# whose origin is down (Cloudflare answers 521). Routing the tunnel has to
# replace that record, not sit beside it.
#
# Replace the tunnel id and the credentials path before use.

tunnel: 00000000-0000-0000-0000-000000000000
credentials-file: /etc/cloudflared/00000000-0000-0000-0000-000000000000.json

# Keep the connection alive on a home line that drops.
originRequest:
  connectTimeout: 30s
  noHappyEyeballs: false
  keepAliveTimeout: 90s

ingress:
  - hostname: quarters.casa
    service: http://127.0.0.1:8787
    originRequest:
      # The dashboard and the API are the same origin; no host rewrite needed.
      httpHostHeader: quarters.casa

  # The apex alone does not cover www; add the record only if you route it.
  - hostname: www.quarters.casa
    service: http://127.0.0.1:8787
    originRequest:
      httpHostHeader: quarters.casa

  # Everything unmatched is refused rather than proxied somewhere by accident.
  - service: http_status:404
