# Cloudflare Tunnel: the Pi dials out to Cloudflare, so nothing has to be
# port-forwarded and the origin stays on loopback.
#
# ⚠ This file is a *fragment*, not a drop-in replacement. The Pi runs one shared
# tunnel (`/etc/cloudflared/config.yml`) that also serves observer, grafana and
# mcp on their own subdomains. Copying this file over that one takes those three
# offline. Merge the `ingress` entry below into the existing list instead, above
# the trailing `http_status:404` — cloudflared uses the first matching rule.
#
# The DNS record is created once, as the user that owns `~/.cloudflared/cert.pem`
# (that is `pi`, not root — under sudo cloudflared cannot find the cert):
#
#   cloudflared tunnel route dns threads-agent threads.quarters.casa
#
# Then restart the tunnel:
#
#   sudo systemctl restart cloudflared

tunnel: 00000000-0000-0000-0000-000000000000
credentials-file: /etc/cloudflared/00000000-0000-0000-0000-000000000000.json

# Keep the connection alive on a home line that drops.
originRequest:
  connectTimeout: 30s
  noHappyEyeballs: false
  keepAliveTimeout: 90s

ingress:
  # Its own subdomain, matching the other services on this tunnel. The apex
  # `quarters.casa` is deliberately not used: it still resolves to a proxied
  # record with no origin behind it and answers 521.
  - hostname: threads.quarters.casa
    service: http://127.0.0.1:8788
    originRequest:
      # The dashboard and the API are the same origin; no host rewrite needed.
      httpHostHeader: threads.quarters.casa

  # Everything unmatched is refused rather than proxied somewhere by accident.
  - service: http_status:404
